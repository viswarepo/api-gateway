server:
  port: 8082

spring:
  application:
    name: api-gateway
  main:
    allow-bean-definition-overriding: true

  data:
    redis:
      host: localhost
      port: 6379

  cloud:
    gateway:
      server:
        webflux:
          # Applied to every route: a shared secret the downstream services could
          # validate to make sure a request actually came through the gateway
          # (see README "Trust boundary"). Not enforced by the sample downstream
          # services yet - see the README for why, and how to add it.
          default-filters:
            - AddRequestHeader=X-Gateway-Secret, "secret1234"

          globalcors:
            cors-configurations:
              '[/**]':
                allowed-origins: "*"
                allowed-methods: GET,POST,PUT,PATCH,DELETE,OPTIONS
                allowed-headers: "*"

          routes:
            - id: bolling-payment-service
              uri: http://localhost:9094
              predicates:
                - Path=/api/v1/invoices/**,
                  /api/v1/payments/**, /api/v1/plans/**, 
                  /api/va/subscriptions/**, /api/v1/webhooks

            - id: plan-catalog-service
              uri: http://localhost:9092
              predicates:
                - Path=/api/v1/products/**,/api/v1/plans/**,
                  /api/v1/features/**,/api/v1/catalog/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalogServiceCB
                    fallbackUri: forward:/fallback/catalog

            - id: subscription-service
              uri: http://localhost:9093
              predicates:
                - Path=/api/v1/customers/**,/api/v1/subscriptions/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: subscriptionServiceCB
                    fallbackUri: forward:/fallback/subscription

            - id: user-service
              uri: http://localhost:9090
              predicates:
                - Path=/api/v1/users/**,/api/v1/org/**

# ---------------------------------------------------------------------------
# Actuator / management
# ---------------------------------------------------------------------------
management:
  endpoints:
    web:
      exposure:
        include: health,gateway,info
  endpoint:
    gateway:
      access: read-only
  health:
    redis:
      enabled: true

# ---------------------------------------------------------------------------
# Circuit breakers
# ---------------------------------------------------------------------------
resilience4j:
  circuitbreaker:
    instances:
      catalogServiceCB:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
      subscriptionServiceCB:
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3

# ---------------------------------------------------------------------------
# App-specific (gateway.*, jwt.*, downstream user-service)
# ---------------------------------------------------------------------------
gateway:
  shared-secret: secret1234
  rate-limit:
    capacity: 1000
    window-seconds: 10
    replenish-rate: 1
  cache:
    ttl-seconds: 30

user-service:
  url: http://localhost:9090

# Must match user-service's internal.api-key
internal:
  api-key: sms_12345

jwt:
  secret: ChangeThisToALongRandomBase64OrPlainSecretOfAtLeast256BitsForHS256!!
  expiration-ms: 3600000
  refresh-expiration-ms: 604800000

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
logging:
  level:
    com.example.gateway: INFO
    org.springframework.cloud.gateway: DEBUG
    org.springframework.web.reactive: DEBUG
    reactor.netty.http.client: DEBUG